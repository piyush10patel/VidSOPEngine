# Render deployment for VidSOPEngine (portfolio scope).
#
# Stack:
#   API           -> Render web service (this file)
#   Frontend      -> Vercel (separate)
#   Database      -> Neon Postgres        (DATABASE_URL secret)
#   Object store  -> Cloudflare R2        (R2_* secrets)
#   AI inference  -> Groq Whisper + OpenRouter vision + Together text models
#
# Pipeline runs inline in the FastAPI process - no separate worker, no Redis.
# Set all `sync: false` values in the Render dashboard after the first deploy.

services:
  - type: web
    name: vidsopengine-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: VidSOPEngine
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.0"

      # Inline pipeline - SOP generation runs in a FastAPI background task.
      # No worker service, no Redis. Trade-off: API process is busy during
      # the 1-3 min synthesis pass, but free-tier deploys stay simple.
      - key: PIPELINE_RUN_MODE
        value: inline

      # --- Neon Postgres ---
      # Paste the pooled connection string from Neon's dashboard. Make sure
      # it starts with postgresql+asyncpg:// (rewrite the scheme if Neon
      # gives you postgresql://) and ends with ?sslmode=require.
      - key: DATABASE_URL
        sync: false

      # --- Cloudflare R2 ---
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false        # https://<account>.r2.cloudflarestorage.com
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false        # optional CDN/public URL prefix
      - key: R2_PRESIGNED_TTL_SECONDS
        value: "3600"

      # /tmp scratch for ffmpeg + Whisper audio extraction. Files are
      # uploaded to R2 after processing and then cleaned from /tmp.
      - key: UPLOAD_DIR
        value: /tmp/vidsop/videos
      - key: MAX_FILE_SIZE_MB
        value: "500"

      # --- AI inference ---
      - key: GROQ_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: together
      - key: VISION_PROVIDER
        value: openrouter
      - key: VISION_MODEL
        value: qwen/qwen3-vl-8b-instruct
      - key: WHISPER_MODEL_SIZE
        value: base
      - key: SOP_SYNTHESIS_MODEL
        value: Qwen/Qwen3-235B-A22B-Instruct-2507-tput
      - key: SOP_VERIFICATION_MODEL
        value: Qwen/Qwen3-235B-A22B-Instruct-2507-tput
      - key: SOP_TRANSLATION_MODEL
        value: meta-llama/Llama-3.3-70B-Instruct-Turbo

      # Persistent storage via R2 - do NOT wipe on startup.
      - key: WIPE_VIDEOS_ON_STARTUP
        value: "false"

      # --- Auth ---
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRATION_MINUTES
        value: "60"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: "none"

      # --- CORS ---
      # After the first Vercel deploy, replace the placeholder below with
      # your real Vercel URL (e.g. https://vidsopengine.vercel.app). The
      # regex covers Vercel preview deploys automatically.
      - key: CORS_ORIGINS
        sync: false        # JSON array, e.g. ["https://your-app.vercel.app","http://localhost:3000"]
      - key: CORS_ORIGIN_REGEX
        value: 'https://.*\.vercel\.app'
